<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>LabInfo TL</title>
    <script>
      (function() {
        var base = location.hostname.endsWith('.github.io') ? '/labinfo' : '';
        var path = location.pathname.slice(base.length).replace(/^\/+|\/+$/g, '');
        var search = location.search ? '&' + location.search.slice(1) : '';
        // Preserve o fragmento usado pelo Supabase Auth (access_token etc.).
        // Sem isso, uma rota amigavel intermediada pelo 404 conclui o login no
        // servidor, mas devolve o navegador ao site sem a sessao OAuth.
        var hash = location.hash || '';
        var target = base + '/' + (path ? '?route=' + encodeURIComponent(path) + search : (location.search || '')) + hash;
        location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando para o LabInfo…</p>
  </body>
</html>
